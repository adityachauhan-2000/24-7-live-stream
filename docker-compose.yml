version: "3.8"

services:
  db:
    image: mysql:8.0
    container_name: stream_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: stream_app
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build: .
    container_name: stream_studio
    restart: always
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
      - ./playlists:/app/playlists
      - ./static/thumbnails:/app/static/thumbnails
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=stream_app

  caddy:
    image: caddy:2-alpine
    container_name: caddy_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
