<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — 24/7 Live Stream Studio</title>
    <meta name="description" content="Create a free account on 24/7 Live Stream Studio and start broadcasting to YouTube around the clock.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --red: #ff0000;
            --border: rgba(255,255,255,0.10);
            --border-focus: rgba(255, 80, 80, 0.6);
            --text: #f1f1f1;
            --muted: #aaaaaa;
            --success: #2ecc71;
            --error: #ff6b6b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #050505;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow-x: hidden;
            position: relative;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.22;
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
        }
        .bg-orb-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #ff0000, transparent);
            top: -150px; right: -100px;
            animation-delay: 0s;
        }
        .bg-orb-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, #ff4500, transparent);
            bottom: -120px; left: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .auth-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2rem;
            text-decoration: none;
        }
        .logo-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        .logo-icon::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
        }
        .logo-icon svg { position: relative; z-index: 1; }
        .logo-text {
            font-size: 1.35rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .logo-text span { color: var(--red); }

        .auth-card {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.04),
                0 20px 60px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(255,0,0,0.05);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-header { margin-bottom: 1.75rem; }
        .card-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #fff;
            margin-bottom: 0.35rem;
        }
        .card-subtitle {
            font-size: 0.875rem;
            color: var(--muted);
        }

        .alert {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.3s ease;
        }
        .alert-error {
            background: rgba(255, 60, 60, 0.12);
            border: 1px solid rgba(255, 60, 60, 0.3);
            color: var(--error);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Two-column grid for password fields */
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group { margin-bottom: 1.1rem; }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.45rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.72rem 0.9rem;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.93rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }
        input:focus {
            border-color: var(--border-focus);
            background: rgba(255,255,255,0.07);
            box-shadow: 0 0 0 3px rgba(255,0,0,0.1);
        }
        input::placeholder { color: #555; }

        /* Password strength indicator */
        .strength-bar {
            height: 3px;
            border-radius: 2px;
            margin-top: 6px;
            background: rgba(255,255,255,0.07);
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s, background 0.3s;
            width: 0%;
        }

        /* Match indicator */
        .match-hint {
            font-size: 0.72rem;
            margin-top: 5px;
            font-weight: 500;
            min-height: 16px;
            transition: color 0.2s;
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, #ff1a1a, #cc0000);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(255,0,0,0.3);
        }
        .btn-submit::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(255,0,0,0.45); }
        .btn-submit:hover::before { opacity: 1; }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* Feature badges */
        .features {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--muted);
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 0.3rem 0.65rem;
        }
        .badge-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--success);
        }

        .auth-footer {
            margin-top: 1.75rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.875rem;
            color: var(--muted);
        }
        .auth-footer a {
            color: #ff6060;
            font-weight: 600;
            text-decoration: none;
            margin-left: 0.35rem;
            transition: color 0.2s;
        }
        .auth-footer a:hover { color: #ff3333; }

        @media (max-width: 480px) {
            .form-row { grid-template-columns: 1fr; }
            .auth-card { padding: 1.75rem 1.25rem; }
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <div class="auth-wrapper">
        <a href="/" class="auth-logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="white">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                </svg>
            </div>
            <span class="logo-text">Stream<span>Studio</span></span>
        </a>

        <div class="auth-card">
            <div class="card-header">
                <h1 class="card-title">Create your account</h1>
                <p class="card-subtitle">Start broadcasting 24/7 to YouTube for free</p>
            </div>

            <div class="features">
                <span class="badge"><span class="badge-dot"></span> Unlimited streams</span>
                <span class="badge"><span class="badge-dot"></span> Private library</span>
                <span class="badge"><span class="badge-dot"></span> Full isolation</span>
            </div>

            {% if error_msg %}
            <div class="alert alert-error">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
                {{ error_msg }}
            </div>
            {% endif %}

            <form action="/signup" method="POST" id="signupForm" onsubmit="return validateSignup(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="yourname"
                            required
                            autofocus
                            autocomplete="username"
                        >
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input
                        type="password"
                        id="signupPassword"
                        name="password"
                        placeholder="At least 6 characters"
                        required
                        minlength="6"
                        oninput="updateStrength(this.value)"
                        autocomplete="new-password"
                    >
                    <div class="strength-bar">
                        <div class="strength-fill" id="strengthFill"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirm_password"
                        placeholder="Repeat password"
                        required
                        minlength="6"
                        oninput="checkMatch()"
                        autocomplete="new-password"
                    >
                    <div class="match-hint" id="matchHint"></div>
                </div>

                <button type="submit" class="btn-submit" id="createBtn">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account?
                <a href="/login">Sign in instead</a>
            </div>
        </div>
    </div>

    <script>
        function updateStrength(val) {
            const fill = document.getElementById('strengthFill');
            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const pct = (score / 5) * 100;
            fill.style.width = pct + '%';
            if (score <= 1) fill.style.background = '#ff4444';
            else if (score <= 3) fill.style.background = '#ffa500';
            else fill.style.background = '#2ecc71';
        }

        function checkMatch() {
            const p1 = document.getElementById('signupPassword').value;
            const p2 = document.getElementById('confirmPassword').value;
            const hint = document.getElementById('matchHint');
            if (!p2) { hint.textContent = ''; return; }
            if (p1 === p2) {
                hint.textContent = '✓ Passwords match';
                hint.style.color = '#2ecc71';
            } else {
                hint.textContent = '✗ Passwords do not match';
                hint.style.color = '#ff6b6b';
            }
        }

        function validateSignup(e) {
            const p1 = document.getElementById('signupPassword').value;
            const p2 = document.getElementById('confirmPassword').value;
            if (p1 !== p2) {
                e.preventDefault();
                document.getElementById('matchHint').textContent = '✗ Passwords do not match';
                document.getElementById('matchHint').style.color = '#ff6b6b';
                return false;
            }
            const btn = document.getElementById('createBtn');
            btn.textContent = 'Creating account…';
            btn.disabled = true;
            return true;
        }
    </script>
</body>
</html>
